<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- ... (head и стили остаются прежними, добавь стиль для таблицы клиентов) ... -->
    <style>
        /* ... (старые стили) ... */
        .client-card { background: var(--tg-theme-secondary-bg-color, #f9f9f9); padding: 12px; border-radius: 8px; margin-bottom: 8px; }
        .client-name { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        .client-info { font-size: 14px; color: var(--tg-theme-hint-color, #888); }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('orders')">Заказы</div>
        <div class="tab" onclick="switchTab('archive')">Архив</div>
        <div class="tab" onclick="switchTab('menu')">Меню</div>
        <div class="tab" onclick="switchTab('clients')">Клиенты</div>
    </div>

    <!-- ... (секции orders, archive, menu остаются) ... -->

    <div id="section-clients" class="section">
        <div id="clients-list">Загрузка...</div>
    </div>

    <script>
        // ... (старые функции switchTab, loadMenu, loadOrders, loadArchive, renderOrders, и т.д.) ...

        async function loadClients() {
            const res = await fetch('/api/clients');
            const data = await res.json();
            const container = document.getElementById('clients-list');
            
            if (!data.clients || data.clients.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#888;margin-top:20px;">Пока нет клиентов</div>';
                return;
            }

            container.innerHTML = '';
            data.clients.forEach(client => {
                container.innerHTML += `
                    <div class="client-card">
                        <div class="client-name">${client.name}</div>
                        <div class="client-info">📱 ${client.phone}</div>
                        <div class="client-info">🔗 @${client.username || 'нет юзернейма'}</div>
                        <div class="client-info">📦 Заказов: ${client.orders_count}</div>
                    </div>
                `;
            });
        }
        
        // Обновляем switchTab, чтобы он вызывал loadClients
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`section-${tabName}`).classList.add('active');

            if (tabName === 'menu') loadMenu();
            if (tabName === 'orders') loadOrders();
            if (tabName === 'archive') loadArchive();
            if (tabName === 'clients') loadClients();
        }

        loadOrders();
    </script>
</body>
</html>
